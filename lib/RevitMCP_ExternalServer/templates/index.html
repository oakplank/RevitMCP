<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>RevitMCP</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-model" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7Z M3 7l9 5 9-5 M12 12v10 M7.5 4.5l9 5v5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-selection" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8Z"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 3V6a2 2 0 0 1 2-2Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 2M18 18A8 8 0 0 1 5 16"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Chats">
      <a class="brand" href="/" aria-label="RevitMCP home"><svg class="brand-mark"><use href="#i-model"/></svg><span>Revit<span class="brand-light">MCP</span></span></a>
      <button class="new-chat" id="new-chat"><svg class="icon"><use href="#i-plus"/></svg>New chat</button>
      <label class="chat-search"><svg class="icon"><use href="#i-search"/></svg><input id="chat-search" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off"></label>
      <div class="sidebar-label">Recent chats</div>
      <nav class="chat-history" id="chat-history" aria-label="Recent chats"></nav>
      <p class="history-empty" id="history-empty" hidden>No matching chats.</p>
      <div class="sidebar-bottom"><button class="sidebar-settings" id="settings-button"><svg class="icon"><use href="#i-settings"/></svg>Settings</button></div>
    </aside>
    <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="Close chat sidebar" hidden></button>
    <main class="workspace">
      <header class="workspace-header">
        <button class="icon-button" id="toggle-sidebar" aria-label="Toggle chat sidebar" aria-controls="sidebar" aria-expanded="true"><svg class="icon"><use href="#i-panel"/></svg></button>
        <h1 id="chat-title">New chat</h1>
        <button class="connection-button" id="connection-button"><span class="status-dot" id="connection-dot"></span><span id="connection-label">Checking Revit</span></button>
      </header>
      <div class="model-context" id="model-context" hidden><svg class="icon"><use href="#i-model"/></svg><span id="document-name"></span><span class="context-divider"></span><span id="view-name"></span><span class="selection-count" id="selection-count"></span><button class="icon-button" id="refresh-context" aria-label="Refresh Revit context"><svg class="icon"><use href="#i-refresh"/></svg></button></div>
      <div class="conversation-scroll" id="conversation-scroll">
        <section class="empty-state" id="empty-state" aria-label="Start a conversation">
          <div class="empty-mark"><svg><use href="#i-model"/></svg></div>
          <h2>What are you working on?</h2>
          <div class="starter-list">
            <button data-prompt="Inspect the selected elements in Revit. Summarize their categories, families, and key parameters."><svg class="icon"><use href="#i-selection"/></svg><span>Inspect selected elements</span><span class="starter-plus">+</span></button>
            <button data-prompt="Help me find missing parameter values in my Revit model. First ask which category and parameters to check."><svg class="icon"><use href="#i-check"/></svg><span>Find missing parameter values</span><span class="starter-plus">+</span></button>
            <button data-prompt="List the schedules in my Revit model and summarize their categories, fields, and filters."><svg class="icon"><use href="#i-table"/></svg><span>Review schedules</span><span class="starter-plus">+</span></button>
          </div>
        </section>
        <section class="message-log" id="message-log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></section>
        <div class="pending-message" id="pending-message" role="status" hidden><span class="working-dot"></span>Working on your request…</div>
        <div class="request-error" id="request-error" role="alert" hidden><strong>Request not completed</strong><p id="request-error-text"></p></div>
      </div>
      <div class="composer-area">
        <form class="composer" id="composer">
          <label class="sr-only" for="message-input">Message</label>
          <textarea id="message-input" rows="2" placeholder="Ask RevitMCP…" maxlength="32000"></textarea>
          <div class="composer-controls">
            <label class="model-picker"><span class="sr-only">AI model</span><select id="model-selector" aria-label="AI model"></select></label>
            <button type="button" class="setup-link" id="setup-button">Add key</button>
            <button type="submit" class="send-button" id="send-button" aria-label="Send message" disabled><svg class="icon"><use href="#i-arrow"/></svg></button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <div class="dialog-heading"><h2 id="settings-title">Settings</h2><button type="button" class="icon-button" data-close="settings-dialog" aria-label="Close settings"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <div class="provider-field"><label for="connection-selector">Connection</label><select id="connection-selector"><option value="openrouter">OpenRouter (recommended)</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="google">Google</option><option value="xai">xAI</option><option value="echo">Test (no AI)</option></select></div>
      <div id="key-field">
        <div class="key-label"><label for="provider-api-key">API key</label><div class="privacy-help" id="privacy-help"><button type="button" class="privacy-button" id="privacy-button" aria-label="Key privacy" aria-describedby="key-privacy">i</button><span id="key-privacy" class="privacy-tooltip" role="tooltip" hidden></span></div><a id="get-api-key" href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener noreferrer">Get a key</a></div>
        <input id="provider-api-key" type="password" autocomplete="off" spellcheck="false" placeholder="OpenRouter API key">
        <div class="key-controls"><label><input id="show-keys" type="checkbox">Show key</label></div>
      </div>
      <details class="custom-model" id="custom-model"><summary>Custom model</summary><div class="custom-model-fields"><label for="custom-model-id">Model ID</label><input id="custom-model-id" placeholder="provider/model" autocomplete="off"></div></details>
      <p class="settings-feedback" id="settings-feedback" role="status"></p>
      <div class="dialog-actions"><button type="button" class="secondary-button" data-close="settings-dialog">Cancel</button><button type="submit" class="primary-button">Save settings</button></div>
    </form>
  </dialog>
  <dialog id="connection-dialog" aria-labelledby="connection-title">
    <div class="dialog-heading"><h2 id="connection-title">Revit connection</h2><button class="icon-button" data-close="connection-dialog" aria-label="Close connection details"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <p id="connection-description" class="dialog-description">Checking the active Revit session.</p>
    <dl class="connection-details" id="connection-details"></dl>
    <div class="dialog-actions"><button class="primary-button" id="check-connection">Refresh connection</button></div>
  </dialog>
  <dialog id="chat-dialog" aria-labelledby="chat-dialog-title">
    <form id="chat-edit-form"><div class="dialog-heading"><h2 id="chat-dialog-title">Chat options</h2><button type="button" class="icon-button" data-close="chat-dialog" aria-label="Close chat options"><svg class="icon"><use href="#i-close"/></svg></button></div><label for="chat-name">Chat name</label><input id="chat-name" maxlength="100" required><div class="dialog-actions"><button type="button" class="text-danger" id="delete-chat">Delete chat</button><button type="submit" class="primary-button">Save name</button></div></form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button id="undo-delete" hidden>Undo</button></div>
  <script id="ai-catalog" type="application/json">{{ model_catalog|tojson }}</script>
</body>
</html>
